version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - IMAGE_REPO_NAME=${IMAGE_REPO_NAME:-argocd-demo-repo}
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}

  build:
    commands:
      - echo "Building the Docker image..."
      - docker build -f Dockerfile -t $IMAGE_REPO_NAME:latest .
      - docker tag $IMAGE_REPO_NAME:latest $REPOSITORY_URI:$IMAGE_TAG
      - docker tag $IMAGE_REPO_NAME:latest $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo "Pushing Docker images to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Updating GitOps workloads repository..."
      - curl -sLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
      - tar -xzf kustomize.tar.gz
      - chmod +x kustomize
      - mv kustomize /usr/local/bin/
      - rm kustomize.tar.gz
      - git config --global user.email "ci-bot@yourdomain.com"
      - git config --global user.name "CodeBuild CI"
      - git clone https://${GITHUB_TOKEN}@github.com/aboroufar/gitops-workloads.git
      - cd gitops-workloads/apps/argocd-demo/environments/prod
      - kustomize edit set image app-image=$REPOSITORY_URI:$IMAGE_TAG
      - git add kustomization.yaml
      # Lines 36-39 fixed: wrap in single quotes to prevent YAML parsing colons as keys
      - 'git commit -m "ci(deploy): update image to ${IMAGE_TAG} [skip ci]" || echo "No changes to commit"'
      - git push origin main