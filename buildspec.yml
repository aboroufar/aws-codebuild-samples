version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing production dependencies...
      - npm install --production
  build:
    commands:
      - echo Packaging Lambda code into zip...
      - zip -rq function.zip service.js calculator.js lambda.js index.html node_modules/ package.json
  post_build:
    commands:
      - echo Updating Lambda function code and publishing new version...
      - FUNCTION_NAME="${FUNCTION_NAME:-blue-green-demo-function}"
      - ALIAS_NAME="${ALIAS_NAME:-live}"
      
      # 1. Update function code & publish a new version
      - aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://function.zip
      - aws lambda wait function-updated --function-name "$FUNCTION_NAME"
      - TARGET_VERSION=$(aws lambda publish-version --function-name "$FUNCTION_NAME" --query "Version" --output text)
      
      # 2. Get the current version active on the alias
      - CURRENT_VERSION=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" --query "FunctionVersion" --output text)
      
      - echo "Shifting traffic from Version $CURRENT_VERSION to Target Version $TARGET_VERSION"

      # 3. Dynamically generate the AppSpec file for CodeDeploy
      # When deploying to AWS Lambda with CodeDeploy, CodeDeploy does not create or publish new 
      # Lambda versions automatically like it does for ECS task definitions.
      - |
        cat <<EOF > appspec.yaml
        version: 0.0
        Resources:
          - TargetService:
              Type: AWS::Lambda::Function
              Properties:
                Name: "$FUNCTION_NAME"
                Alias: "$ALIAS_NAME"
                CurrentVersion: "$CURRENT_VERSION"
                TargetVersion: "$TARGET_VERSION"
        EOF

artifacts:
  files:
    - appspec.yaml