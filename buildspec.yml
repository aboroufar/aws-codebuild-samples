version: 0.2

phases:
  pre_build:
    commands:
      - "echo Logging in to Amazon ECR..."
      - "aws --version"
      - "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME"
      - "aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - "COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
      - "IMAGE_TAG=${COMMIT_HASH:=$IMAGE_TAG}"

  build:
    commands:
      - "echo Building the Docker image..."
      - "docker build -f Dockerfile.build_env -t $IMAGE_REPO_NAME:latest ."
      - "docker tag $IMAGE_REPO_NAME:latest $REPOSITORY_URI:$IMAGE_TAG"
      - "docker tag $IMAGE_REPO_NAME:latest $REPOSITORY_URI:latest"

  post_build:
    commands:
      - "echo Pushing the Docker images to ECR..."
      - "docker push $REPOSITORY_URI:latest"
      - "docker push $REPOSITORY_URI:$IMAGE_TAG"
      - "echo Resolving task definition placeholders with jq..."
      - "EXEC_ROLE_ARN=\"arn:aws:iam::$AWS_ACCOUNT_ID:role/blue-green-demo-ecs-execution-role\""
      - "TASK_ROLE_ARN=\"arn:aws:iam::$AWS_ACCOUNT_ID:role/blue-green-demo-ecs-task-role\""
      - "jq --arg IMG \"$REPOSITORY_URI:$IMAGE_TAG\" --arg EXEC \"$EXEC_ROLE_ARN\" --arg TASK \"$TASK_ROLE_ARN\" '.containerDefinitions[0].image = $IMG | .executionRoleArn = $EXEC | .taskRoleArn = $TASK' taskdef.json > taskdef_updated.json"
      
artifacts:
  files:
    - appspec.yml
    - taskdef_updated.json