version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/calculator

permissions:
  - object: /home/ec2-user/calculator
    pattern: "**"
    owner: ec2-user
    group: ec2-user

hooks:
  ApplicationStop:
    - location: deploy_scripts/stop.sh
      timeout: 300
      runas: root
  BeforeInstall:
    - location: deploy_scripts/install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: deploy_scripts/after_install.sh
      timeout: 300
      runas: ec2-user
  ApplicationStart:
    - location: deploy_scripts/start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: deploy_scripts/validate.sh
      timeout: 300
      runas: ec2-user